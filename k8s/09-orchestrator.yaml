---
# Orchestrator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: maaps
  labels:
    app: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      # Pod Anti-Affinity: Spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - orchestrator
              topologyKey: kubernetes.io/hostname
      # Init container to wait for dependencies
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres.maaps.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-qdrant
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z qdrant.maaps.svc.cluster.local 6333; do echo waiting for qdrant; sleep 2; done']
      containers:
      - name: orchestrator
        image: ghcr.io/your-org/maaps/orchestrator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: maaps-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maaps-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: POSTGRES_DB
        - name: QDRANT_HOST
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: QDRANT_HOST
        - name: QDRANT_PORT
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: QDRANT_PORT
        - name: SELENIUM_HOST
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: SELENIUM_HOST
        - name: SELENIUM_PORT
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: SELENIUM_PORT
        - name: GPU_WORKER_HOST
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: GPU_WORKER_HOST
        - name: GPU_WORKER_PORT
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: GPU_WORKER_PORT
        - name: HEARTMULA_API_KEY
          valueFrom:
            secretKeyRef:
              name: maaps-secrets
              key: HEARTMULA_API_KEY
              optional: true
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: maaps-secrets
              key: ELEVENLABS_API_KEY
              optional: true
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: maaps-secrets
              key: GITHUB_WEBHOOK_SECRET
              optional: true
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: maaps-config
              key: TZ
        volumeMounts:
        - name: local-files
          mountPath: /files
        - name: cache
          mountPath: /app/.cache
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: local-files
        persistentVolumeClaim:
          claimName: local-files-pvc
      - name: cache
        emptyDir: {}

---
# Orchestrator Service
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: maaps
  labels:
    app: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: LoadBalancer

---
# HorizontalPodAutoscaler for Orchestrator
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
  namespace: maaps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
